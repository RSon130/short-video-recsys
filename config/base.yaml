# Base configuration — data-source agnostic.
# Override in a data-source-specific config (e.g. kuairec.yaml).
#
# This file describes the system that EXISTS. Settings for planned-but-unbuilt
# work live in the "Future work" block at the bottom, commented out, so that
# nothing here implies a component that isn't in the code.

project:
  name: short-video-recsys
  version: "1.0"
  seed: 42

data:
  source: kuairec           # swap to: simulator | custom
  raw_dir: datastore/raw
  processed_dir: datastore/processed
  train_ratio: 0.8
  val_ratio: 0.1
  # test_ratio = 1 - train_ratio - val_ratio

# Canonical column names — all data sources must map to these
schema:
  user_id: user_id
  item_id: item_id
  timestamp: timestamp
  watch_ratio: watch_ratio   # 0-1, proxy for watch time
  like: like                 # binary
  comment: comment           # binary
  share: share               # binary
  follow: follow             # binary

features:
  user_emb_dim: 64
  item_emb_dim: 64
  # Fallbacks only. The real dense dimensions are derived from the processed
  # parquet files at runtime (see features/dense_features.py) because the
  # one-hot category expansion isn't known until the data is loaded.
  user_dense_dim: 16
  item_dense_dim: 16
  num_neg_samples: 4         # negatives per positive for retrieval training

  # Engagement thresholds for BPR labelling. KuaiRec is fully observed (99.6%
  # density measured on small_matrix), so negatives are *known* low-engagement
  # interactions rather than guessed-at unobserved pairs. Interactions between
  # the two thresholds are ambiguous and excluded from retrieval training.
  # Measured distribution: 56.6% of interactions are >= 0.7, 14.6% are <= 0.3,
  # and all 1,411 users have at least one item below 0.3.
  positive_watch_ratio: 0.7
  negative_watch_ratio: 0.3

two_tower:
  tower_hidden: [256, 128]
  embedding_dim: 64          # final output embedding (shared retrieval space)
  dropout: 0.1

ranking:
  # MLP ranker: hidden layer widths, then a 1-unit sigmoid head.
  # These were previously named d_model / ffn_dim — Transformer vocabulary for
  # what is a plain MLP. Renamed so the config matches the model.
  hidden_dims: [256, 128]
  dropout: 0.1
  # Single task: regress watch_ratio with MSE. Multi-task is future work.

# Note on number formats: write learning rates as plain decimals (0.001), not
# as 1e-3. PyYAML follows YAML 1.1, where an exponent needs a decimal point and
# a signed exponent (1.0e-3) to be a float — bare 1e-3 loads as a *string* and
# fails deep inside the optimiser with a confusing type error.
training:
  retrieval:
    epochs: 20                      # upper bound; early stopping usually ends sooner
    early_stopping_patience: 3      # epochs without validation improvement
    batch_size: 1024
    lr: 0.001
    weight_decay: 0.00001
    device: auto            # auto | cpu | cuda
    checkpoint_dir: checkpoints/retrieval
  ranking:
    epochs: 30                      # upper bound; early stopping usually ends sooner
    early_stopping_patience: 3
    batch_size: 512
    lr: 0.0005
    weight_decay: 0.00001
    device: auto
    checkpoint_dir: checkpoints/ranking

retrieval:
  # IndexFlatIP — exact inner-product search. At this item count exact search
  # is ~1 ms, so an approximate index would add tuning burden for no gain.
  # retrieval/faiss_index.py builds this unconditionally; there is deliberately
  # no index_type switch until there is a second index to switch to.
  top_k_recall: 200          # candidates passed to the ranker
  index_path: datastore/processed/faiss.index

serving:
  host: 0.0.0.0
  port: 8000
  top_k_final: 20            # default recommendations returned
  cache_ttl_seconds: 300     # in-memory TTL cache

evaluation:
  k_values: [5, 10, 20]
  ab_test_traffic_split: 0.5

monitoring:
  log_dir: logs

