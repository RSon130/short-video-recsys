# Base configuration — data-source agnostic.
# Override in a data-source-specific config (e.g. kuairec.yaml).
#
# This file describes the system that EXISTS. Settings for planned-but-unbuilt
# work live in the "Future work" block at the bottom, commented out, so that
# nothing here implies a component that isn't in the code.

project:
  name: short-video-recsys
  version: "1.0"
  seed: 42

data:
  source: kuairec           # swap to: simulator | custom
  raw_dir: datastore/raw
  processed_dir: datastore/processed
  train_ratio: 0.8
  val_ratio: 0.1
  # test_ratio = 1 - train_ratio - val_ratio

# Canonical column names — all data sources must map to these
schema:
  user_id: user_id
  item_id: item_id
  timestamp: timestamp
  watch_ratio: watch_ratio   # 0-1, proxy for watch time
  like: like                 # binary
  comment: comment           # binary
  share: share               # binary
  follow: follow             # binary

features:
  user_emb_dim: 64
  item_emb_dim: 64
  # Fallbacks only. The real dense dimensions are derived from the processed
  # parquet files at runtime (see features/dense_features.py) because the
  # one-hot category expansion isn't known until the data is loaded.
  user_dense_dim: 16
  item_dense_dim: 16
  num_neg_samples: 4         # negatives per positive for retrieval training

  # Engagement thresholds for BPR labelling. KuaiRec is fully observed (99.6%
  # density measured on small_matrix), so negatives are *known* low-engagement
  # interactions rather than guessed-at unobserved pairs. Interactions between
  # the two thresholds are ambiguous and excluded from retrieval training.
  # Measured distribution: 56.6% of interactions are >= 0.7, 14.6% are <= 0.3,
  # and all 1,411 users have at least one item below 0.3.
  positive_watch_ratio: 0.7
  negative_watch_ratio: 0.3

two_tower:
  tower_hidden: [256, 128]
  embedding_dim: 64          # final output embedding (shared retrieval space)
  dropout: 0.1

  # Whether the retrieval towers consume dense side features alongside the
  # learned ID embedding. Set from a measured ablation on the test split
  # (150 users, top_k_recall=200), not from taste:
  #
  #   towers            retrieval recall@10   full-pipeline recall@10   AUC
  #   ID only                       0.2747                    0.4793   0.854
  #   ID + side features            0.2887                    0.3593   0.753
  #
  # Side features lift retrieval slightly on its own, yet cost the end-to-end
  # system a quarter of its recall. The item features are dominated by category
  # one-hots and popularity counts, which pull the embedding space toward
  # category clustering rather than personalised affinity, and hand the ranker
  # a more homogeneous shortlist. The ranker consumes the same features anyway,
  # where they measurably help.
  use_dense_features: false

  # Retrieval objective.
  #   infonce  In-batch sampled softmax. Each user's positive competes with the
  #            other users' positives in the batch, which is the only thing in
  #            either objective that pushes two user embeddings apart.
  #   bpr      Pairwise, per-user, independent across users.
  #
  # bpr collapsed every user embedding onto a single vector (per-dim std 4e-06,
  # one unique row of 7,176). Item quality explains 29.5% of watch_ratio
  # variance and acts as an attractor; nothing in BPR resists it. The abandoned
  # signal is real — ~59% of variance is user-item interaction, and users' top-50
  # lists overlap at Jaccard 0.045 vs 0.003 at chance.
  objective: infonce
  temperature: 0.07

ranking:
  # MLP ranker: hidden layer widths, then a 1-unit sigmoid head.
  # These were previously named d_model / ffn_dim — Transformer vocabulary for
  # what is a plain MLP. Renamed so the config matches the model.
  hidden_dims: [256, 128]
  dropout: 0.1

  # Training objective.
  #   listwise    Softmax cross-entropy over one positive and num_neg_samples
  #               negatives from the same user (sampled softmax / InfoNCE).
  #               Optimises "does the positive rank first", which is the question
  #               recall@K poses. Each step sees several contrasts, not one.
  #   pairwise    BPR over a single (positive, negative) pair — the N=1 case.
  #   regression  MSE against observed watch_ratio. Optimises calibration.
  #
  # Measured on big_matrix, all 6,873 test users:
  #
  #   objective     recall@5  recall@10  recall@20  watch-AUC
  #   regression      0.0031     0.0070     0.0093      0.714
  #   pairwise        0.0112     0.0141     0.0099      0.622
  #   listwise        0.0081     0.0099     0.0100      0.609
  #
  # regression optimises calibration and duly wins watch-AUC while losing badly
  # on ordering. pairwise wins the ranking metrics and is the default.
  #
  # listwise did NOT beat pairwise, contrary to expectation — more negatives per
  # step usually helps. One hypothesis was tested and refuted: per-user negative
  # pools are large (median 233; only 1% of users below 10), so sampling 4 with
  # replacement is not collapsing to duplicates. The untested explanation is
  # saturation — with four *easy* random negatives the softmax is satisfied as
  # soon as the positive outranks all of them, so late-training gradients vanish
  # faster than single-pair BPR's. If so the fix is harder negatives, not more of
  # them: sample from retrieval's shortlist rather than from the whole low-watch
  # pool. That is the next experiment, and it points at the same place the
  # unclosed recall@5 gap does — candidate generation.
  objective: pairwise
  # Single task. Multi-task (watch + like) is future work.

# Note on number formats: write learning rates as plain decimals (0.001), not
# as 1e-3. PyYAML follows YAML 1.1, where an exponent needs a decimal point and
# a signed exponent (1.0e-3) to be a float — bare 1e-3 loads as a *string* and
# fails deep inside the optimiser with a confusing type error.
training:
  retrieval:
    epochs: 20                      # upper bound; early stopping usually ends sooner
    early_stopping_patience: 3      # epochs without validation improvement
    batch_size: 1024
    lr: 0.001
    weight_decay: 0.00001
    device: auto            # auto | cpu | cuda
    checkpoint_dir: checkpoints/retrieval
  ranking:
    epochs: 30                      # upper bound; early stopping usually ends sooner
    early_stopping_patience: 3
    batch_size: 512
    lr: 0.0005
    weight_decay: 0.00001
    device: auto
    checkpoint_dir: checkpoints/ranking

retrieval:
  # IndexFlatIP — exact exhaustive search. Measured, not assumed; the full
  # comparison is in docs/index_benchmark.md.
  #
  # At this catalogue (9,958 items, top_k=200, single-query):
  #   flat     0.087 ms p50   recall 1.0000   2.55 MB
  #   ivfflat  0.036 ms p50   recall 0.9051   2.66 MB
  #   hnsw     0.045 ms p50   recall 0.7683   5.26 MB
  #
  # ANN is 2.4x faster and it does not matter: 0.087 ms against a 9.6 ms
  # end-to-end p95 means the speedup saves 0.5% of a request in exchange for
  # 10-23% of the true neighbours.
  #
  # Exact search is linear — 0.087 ms at 10K, 0.884 ms at 100K, 9.19 ms at 1M —
  # so the crossover is around 300-500K items for this latency target. Above it,
  # tune to a recall target rather than a speedup: at 100K, reaching recall >=0.9
  # needs HNSW at efSearch=256, which is only 1.3x faster than brute force.
  index_type: flat           # flat | ivfflat | hnsw
  top_k_recall: 200          # candidates passed to the ranker
  index_path: datastore/processed/faiss.index

serving:
  host: 0.0.0.0
  port: 8000
  top_k_final: 20            # default recommendations returned
  cache_ttl_seconds: 300     # in-memory TTL cache

evaluation:
  k_values: [5, 10, 20]
  ab_test_traffic_split: 0.5

monitoring:
  log_dir: logs

