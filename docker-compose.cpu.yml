# CPU compose — default for Tier 1.
#
#   docker compose -f docker-compose.cpu.yml build
#   docker compose -f docker-compose.cpu.yml run --rm api python features/engineer.py
#   docker compose -f docker-compose.cpu.yml up api
#
# The whole project is bind-mounted at /app so edits on the host take effect
# without a rebuild — the pipeline is still being debugged, so the edit/run loop
# needs to stay tight. The image is rebuilt only when dependencies change.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      target: runtime
    image: short-video-recsys:cpu
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Project root on the path so any entry point works, whether invoked as
      # `python features/engineer.py` or `python -m features.engineer`.
      - PYTHONPATH=/app

  # Same code, plus test/lint tooling. Use for pytest and for pipeline steps:
  #   docker compose -f docker-compose.cpu.yml run --rm dev pytest -q
  dev:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      target: dev
    image: short-video-recsys:dev
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Project root on the path so any entry point works, whether invoked as
      # `python features/engineer.py` or `python -m features.engineer`.
      - PYTHONPATH=/app
